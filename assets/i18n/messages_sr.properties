scroll.first.title=PRVO VEZIVANJE
scroll.first.body=?elik ga nije mogao raniti. Vatra ga nije mogla o?istiti.\n\nOno ?to nije moglo biti uni?teno bilo je vezano.\n\nTri za?titna znaka podignuta su preko mora,\na srce rituala ostalo je u sredi?tu.\n\nKada je poslednji znak postavljen, crvene no?i su se povukle.

scroll.second.title=DUGO BDIJENJE
scroll.second.body=Ti?ina nas je navela da mislimo da smo pobedili.\n\nZa?titni znaci slabili su sa svakom narednom generacijom.\n\nNajpre su do?le du?e no?i. Zatim su se senke vratile.\n\nPopravljali smo ono ?to smo mogli.\nDrugi su pobegli dok su stari putevi i pristani?te jo? dr?ali.\n\nNa kraju je ostalo manje ruku nego zidova koje je trebalo popravljati.

scroll.third.title=PREKR?ENA ZAKLETVA
scroll.third.body=Ritual nikada nije bio izgubljen.\n\nMi smo ga sami podelili.\n\nOno ?to je jednom u?injeno nikada vi?e ne sme biti u?injeno olako.\n\nZato su njegove stranice odnete odvojeno, preko mora.\n\nGovorili smo sebi da je to milosrdniji izbor.\n\nNeka obe?anja je lak?e prekr?iti kada onaj kome ste ih dali ne mo?e da vas prati.
