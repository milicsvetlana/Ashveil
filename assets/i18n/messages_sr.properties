guidance.movement=Budan si. Dobro. Koristi WASD za kretanje.
guidance.starterChest=U blizini je sanduk. Pogledaj šta je ostavljeno unutra.
guidance.planting=To seme možda još može da pusti koren. Pripremi komad zemlje i posadi ga.
guidance.collectWood=Zemlja još pamti. Pusti je da odradi svoje. Uskoro će ti trebati drvo.
guidance.openCrafting=To drvo ti neće mnogo koristiti dok ti samo stoji u džepovima. Otvori meni za izradu i pogledaj šta možeš da napraviš.
guidance.craftEquipment=Pogledaj šta možeš da napraviš od onoga što si sakupio. Izaberi šta god ti deluje korisno.
guidance.dusk=Svetlost nestaje. Šta god da radiš, nemoj ovu noć pomešati sa običnom. Drži oružje pri ruci.
guidance.healing=Rane ovde dugo ostaju. Hrana ti može pomoći da se oporaviš, ako imaš nešto viška.
guidance.boatKitFindJetty=Drvo i kamen te odavde neće odvesti nikuda. Negde duž obale, staro pristanište još dopire iza Vela. Pronađi ga.
guidance.oldJettyFound=Neko je jednom pokušao da ode odavde. Pristanište ih je nadživelo. Zapamti ga.
guidance.boatKitReturnToJetty=Ono staro pristanište koje si pronašao... Odnesi komplet tamo.
guidance.boatBuilt=Dobro. Trebalo bi da izdrži. Idi do sredine pristaništa i pokušaj da se ukrcaš. Odatle ćeš videti kuda ti Veo još dozvoljava da odeš.

# ==========================================================
# SCROLLS
# ==========================================================

scroll.first.title=PRVO VEZIVANJE
scroll.first.body=Čelik ga nije mogao raniti. Vatra ga nije mogla očistiti.\n\nOno što nije moglo biti uništeno, bilo je vezano.\n\nTri zaštitna znaka podignuta su iza obale,\na srce rituala ostalo je u središtu.\n\nKada je poslednji znak postavljen, crvene noći su se povukle.

scroll.second.title=DUGO BDIJENJE
scroll.second.body=Tišinu smo zamenili za pobedu.\n\nZaštitni znaci slabili su sa svakom narednom generacijom.\n\nNajpre su došle duže noći. Zatim su se senke vratile.\n\nPopravljali smo ono što smo mogli.\nDrugi su pobegli dok su stari putevi i pristanište još držali.\n\nNa kraju je ostalo manje ruku nego zidova koje je trebalo popraviti.

scroll.third.title=PREKRŠENA ZAKLETVA
scroll.third.body=Ritual nikada nije bio izgubljen.\n\nMi smo ga sami podelili.\n\nOno što je jednom učinjeno nikada više ne sme biti učinjeno olako.\n\nZato su njegove stranice odnete odvojeno, preko mora.\n\nGovorili smo sebi da je to milosrdniji izbor.\n\nNeka obećanja je lakše prekršiti kada onaj kome ste ih dali ne može da vas prati.

# ==========================================================
# WINDY PLAINS GUIDANCE
# ==========================================================

guidance.windyArrival=Dakle. Još jedna obala.\nVetar čini da ovo prazno mesto zvuči gotovo živo.\nGotovo.
guidance.windyGuardianStarted=Pa dobro.\nTo mu je privuklo pažnju.\nPokušaj da ne pogineš.
guidance.windyScrollIRead=Uradili su ono što su morali.\nLjudi postaju veoma hrabri kada se dovoljno uplaše.
guidance.wispGlobalUnlocked=Ostrvo nam se opire.

# ==========================================================
# DARKROOT ISLE GUIDANCE
# ==========================================================

guidance.darkrootArrival=Koreni ovde sežu duboko.\nPazi gde staješ.
guidance.darkrootScrollIIRead=Pisali su kao da su sve to izdržali zajedno.\nNisu.

# ==========================================================
# VEILSCAR PASSAGE GUIDANCE
# ==========================================================

guidance.veilscarArrival=Ovo mesto deluje bliže rani.\nOstani usredsređen.\nNemamo još mnogo do kraja.
guidance.veilscarScrollIIIRead=Zgodno, zar ne? Nazvati nešto milošću tek kada više nisi ti taj koji plaća cenu.
guidance.veilscarScrollIIIFollowup=Sačuvaj stranicu. Sada smo blizu.

guidance.riteReturn=Eto.\nNazad tamo gde je sve počelo.\nOdnesi stranice do starog kruga.

# ==========================================================
# REWARD CARDS
# ==========================================================

reward.swiftStep.description=Kreći se poput vetra.\n\nPritisni [SHIFT] tokom kretanja da izvedeš brzi nalet.\nPređi uske prepreke jednim naletom.
reward.blackthornCraft.description=Drevni zanat trnja sada je u tvojim rukama.\n\nBriar Snare i Thorn Fence\nsada mogu da se izrađuju.
reward.bloodthirst.description=Sečivo se hrani krvlju.\nNjegova oštrica se nikada neće istupiti.\n\nNanosi 9 štete neprijateljima.\nNema izdržljivost.

