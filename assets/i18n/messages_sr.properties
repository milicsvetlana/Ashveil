# ==========================================================
# CRIMSON VEIL
# ==========================================================

guidance.crimsonVeilWarning=Ta boja... Nadao sam se da je nećeš videti ovako rano. Veo se spušta. Kada se spusti, nema odlaska dok se ponovo ne razbije.

# ==========================================================
# ASHEN RITE
# ==========================================================

guidance.ashenRiteReveal1=Eto. Posle toliko vremena, Ritual je ponovo celovit.
guidance.ashenRiteReveal2=Pročitao si ono što su ostavili za sobom, zar ne? Veoma su pažljivo birali reči.
guidance.ashenRiteReveal3=Pisali su o dužnosti. O milosti. O žrtvi. Smešne reči, kada ste vi ti koji odlazite.
guidance.ashenRiteReveal4=Nazvali su to žrtvom zato što su oni bili ti kojima je bilo dozvoljeno da odu.
guidance.ashenRiteReveal5=U taj krug sam stupio svojom voljom. Držao sam Ashveil vezanim dok su njihova deca starila. A zatim i njihova deca.
guidance.ashenRiteReveal6=Dao sam im jedan životni vek. Zatim još jedan. Pa još jedan. Koliko su mislili da im dugujem?
guidance.ashenRiteReveal7=Ritual nikada nije bio namenjen jednoj duši da ga nosi zauvek. Obećali su da će neko zauzeti moje mesto. Kada je došlo vreme da ispune to obećanje... razdvojili su Ritual i ostavili me ovde.
guidance.lastVeilStart=Ne boj se. Uskoro će biti gotovo.

guidance.lastVeilFight1=Zašto se još uvek boriš?
guidance.lastVeilFight2=Ne bi trebalo da ih je ostalo ovako malo...
guidance.lastVeilFight3=Šta to radiš?
guidance.lastVeilFight4=Prestani. Samo prestani da se boriš.

guidance.lastVeilAftermath1=...Šta si uradio?
guidance.lastVeilAftermath2=Ne.
guidance.lastVeilAftermath3=Nije trebalo ovako da se završi.
