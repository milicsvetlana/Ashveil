guidance.movement=You're awake. Good. Use WASD to move around.
guidance.starterChest=There's a chest nearby. See what was left inside.
guidance.planting=Those seeds may still take root. Prepare a patch of soil and plant one.
guidance.collectWood=The soil still remembers. Let it do its work. You will need wood before long.
guidance.openCrafting=That wood won't do much sitting in your pockets. Open your crafting menu. See what you can make from it.
guidance.craftEquipment=See what can be made from what you've gathered. Choose whatever seems useful.
guidance.dusk=The light is fading. Whatever you do, don't mistake the night here for an ordinary one. Keep a weapon close.
guidance.healing=Wounds linger here. Food may help you recover, if you have any to spare.
guidance.boatKitFindJetty=Timber and stone will get you nowhere from here. Somewhere along the coast, an old jetty still reaches beyond the Veil. Find it.
guidance.oldJettyFound=Someone tried to leave from here once. The jetty survived them. Remember it.
guidance.boatKitReturnToJetty=That old jetty you found... Take the kit there.
guidance.boatBuilt=Good. It should hold. Go to the middle of the jetty and try to board. From there, you'll see where the Veil still lets you go.

# ==========================================================
# SCROLLS
# ==========================================================

scroll.first.title=THE FIRST BINDING
scroll.first.body=Steel could not wound it. Fire could not cleanse it.\n\nWhat could not be destroyed was bound.\n\nThree wards were raised beyond the shore,\nand the heart of the rite remained at the center.\n\nWhen the final mark was set, the red nights receded.

scroll.second.title=THE LONG VIGIL
scroll.second.body=We mistook silence for victory.\n\nThe wards weakened with every passing generation.\n\nFirst came the longer nights. Then the shadows returned.\n\nWe repaired what we could.\nOthers fled while the old roads and the jetty still held.\n\nIn the end, there were fewer hands than walls left to mend.

scroll.third.title=THE BROKEN OATH
scroll.third.body=The Rite was never lost.\n\nWe divided it ourselves.\n\nWhat was done once must never be done lightly again.\n\nSo its pages were carried apart, beyond the sea.\n\nWe told ourselves it was the kinder choice.\n\nSome promises are easier to break when the one you made them to cannot follow.

# ==========================================================
# WINDY PLAINS GUIDANCE
# ==========================================================

guidance.windyArrival=So. Another shore.\nThe wind makes an empty place sound almost alive.\nAlmost.
guidance.windyGuardianStarted=Well.\nThat got its attention.\nTry not to die.
guidance.windyScrollIRead=They did what they had to.\nPeople become very brave when they are afraid enough.
guidance.wispGlobalUnlocked=The island is resisting us.

# ==========================================================
# DARKROOT ISLE GUIDANCE
# ==========================================================

guidance.darkrootArrival=The roots run deep here.\nWatch where you step.
guidance.darkrootScrollIIRead=They wrote as if they endured it together.\nThey didn't.

# ==========================================================
# VEILSCAR PASSAGE GUIDANCE
# ==========================================================

guidance.veilscarArrival=This place feels closer to the wound.\nStay focused.\nWe don't have much farther to go.
guidance.veilscarScrollIIIRead=Convenient, isn't it?\nTo call something mercy once you're no longer the one paying for it.\n\nKeep the page.\nWe have all three now.\nTake them back to the heart of the island.

guidance.riteReturn=There.\nBack where this began.\nBring the pages to the old circle.

# ==========================================================
# REWARD CARDS
# ==========================================================

reward.swiftStep.description=Move with the wind.\n\nPress [SHIFT] while moving to dash.\nCross narrow hazards in a single burst.
reward.blackthornCraft.description=Ancient briarwork is yours to command.\n\nBriar Snare and Thorn Fence\ncan now be crafted.
reward.bloodthirst.description=The blade feeds on blood.\nIts edge will never dull.\n\nDeals 9 damage to enemies.\nNo durability.
